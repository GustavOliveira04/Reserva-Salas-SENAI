{% extends "base.html" %}

{% block title %}Login administrativo{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm plan-sheet">
            <div class="card-body p-4">
                <h1 class="h4 mb-1"><i class="bi bi-lock me-2"></i>Área administrativa</h1>
                <p class="text-muted mb-4">Informe a senha para acessar as solicitações.</p>

                <form method="post">
                    <input type="hidden" name="next" value="{{ next_url }}">
                    <div class="mb-3">
                        <label for="password" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="password" name="password"
                               autofocus required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>

                <div class="text-center mt-3">
                    <a href="{{ url_for('admin_forgot_password') }}" class="small">
                        Esqueci minha senha
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
