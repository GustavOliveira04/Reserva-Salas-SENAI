{% extends "base.html" %}

{% block title %}Definir nova senha{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm plan-sheet">
            <div class="card-body p-4">
                <h1 class="h4 mb-1"><i class="bi bi-key me-2"></i>Definir nova senha</h1>
                <p class="text-muted mb-4">Escolha uma nova senha para a área administrativa.</p>

                <form method="post">
                    <div class="mb-3">
                        <label for="new_password" class="form-label">Nova senha</label>
                        <input type="password" class="form-control" id="new_password" name="new_password"
                               minlength="6" autofocus required>
                        <div class="form-text">Mínimo de 6 caracteres.</div>
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Confirmar nova senha</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                               minlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Salvar nova senha</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
